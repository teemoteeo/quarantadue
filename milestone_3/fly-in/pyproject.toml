[project]
name = "fly-in"
version = "0.1.0"
description = "Multi-drone routing simulation with constrained pathfinding."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "flake8>=7.0",
    "mypy>=1.10",
]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
